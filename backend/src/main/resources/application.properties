spring.application.name=supportai-backend
server.port=8080

# Profiles
spring.profiles.active=dev

# H2 Database Configuration (Default Development)
spring.datasource.url=jdbc:h2:mem:supportaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351
app.jwt.expiration-ms=86400000

# AI / NLP Service Configurations
# Providers: "auto" (uses Gemini or OpenAI if key present, else local), "gemini", "openai", "local"
ai.provider=auto
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-1.5-flash
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-4o-mini
