services:
  # Spring Boot Backend
  - type: web
    name: supportai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: true

  # React Frontend
  - type: web
    name: supportai-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://supportai-backend.onrender.com
    autoDeploy: true